<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMA Web Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">

    <h2 class="app-title">IMA Web Clipper</h2>

    <!-- State: Not configured -->
    <div class="state" id="state-empty">
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        <h3>还未完成设置</h3>
        <p>请先到设置页配置 API 凭证<br>并选择目标知识库</p>
        <button id="btn-open-settings" class="btn btn-primary btn-full">⚙️ 打开设置页面</button>
      </div>
    </div>

    <!-- State: Ready to clip -->
    <div class="state" id="state-ready">
      <div class="config-bar">
        <span class="config-check">✅</span>
        <span>已连接到 </span>
        <strong id="config-kb-name">知识库</strong>
        <button id="btn-config-link" class="config-link">设置</button>
      </div>

      <!-- Mode Tabs -->
      <div class="mode-tabs" id="mode-tabs">
        <div class="mode-tab active" data-mode="full">📄 完整内容</div>
        <div class="mode-tab" data-mode="url">🔗 仅 URL</div>
      </div>

      <!-- Panel: Markdown Preview (only in full mode) -->
      <div id="panel-full" class="mode-panel">
        <div class="tpl-card">
          <div class="tpl-head">
            <span>📄 预览效果</span>
            <select id="tpl-switcher" class="tpl-switcher"></select>
          </div>
          <div class="tpl-body">
            <div id="tpl-body-content" class="tpl-body-content">
              <div style="padding:20px;text-align:center;color:#94A3B8;font-size:12px;">正在提取页面内容...</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Panel: URL hint (only in url mode) -->
      <div id="panel-url" class="mode-panel" style="display:none;">
        <div class="url-hint">
          <div class="url-hint-icon">🔗</div>
          <div class="url-hint-text">将当前页面链接保存到知识库</div>
          <div class="url-hint-desc">由 IMA 服务端抓取页面内容，无需本地提取转换</div>
        </div>
      </div>

      <!-- KB Dropdown -->
      <div class="form-group">
        <label>目标知识库</label>
        <div class="kb-dd" id="kb-dd">
          <button class="kb-dd-trigger" id="kb-dd-trigger" type="button">
            <span id="kb-dd-label">加载中...</span>
            <span class="kb-dd-arrow">▾</span>
          </button>
          <ul class="kb-dd-menu" id="kb-dd-menu" hidden></ul>
        </div>
      </div>

      <button id="btn-clip" class="btn btn-primary btn-full">✨ 添加到 ima.copilot</button>
    </div>

    <!-- State: Clipping -->
    <div class="state" id="state-clipping">
      <div class="clip-progress">
        <div class="clip-icon">⏳</div>
        <h4>正在保存到 ima.copilot...</h4>
        <p class="clip-status-text" id="clip-status-text">请稍候</p>
      </div>
    </div>

    <!-- State: Done -->
    <div class="state" id="state-done">
      <div class="clip-done">
        <div class="done-icon">✅</div>
        <h4>添加成功！</h4>
        <p>已保存到 <strong id="done-kb-label">知识库</strong></p>
        <button id="btn-back-to-ready" class="btn btn-secondary btn-full">↩️ 继续添加</button>
      </div>
    </div>

  </div>

  <!-- 浮动日志按钮：fixed 覆盖在弹窗上，不影响布局 -->
  <button id="log-float-btn" class="log-float-btn" type="button" title="查看操作日志">
    <img src="../icons/rizhi.png" alt="日志">
  </button>

  <!-- 日志面板：从底部滑出 -->
  <div id="log-panel" class="log-panel" hidden>
    <div id="log-mask" class="log-mask"></div>
    <div class="log-sheet">
      <div class="log-sheet-head">
        <span class="log-sheet-title">📋 操作日志</span>
        <span class="log-count" id="log-count">0 条</span>
        <label class="log-filter"><input type="checkbox" id="log-filter-err"> 只看错误</label>
        <button id="log-clear" class="log-btn" type="button">清空</button>
        <button id="log-close" class="log-btn" type="button">✕</button>
      </div>
      <div class="log-body" id="log-body"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
