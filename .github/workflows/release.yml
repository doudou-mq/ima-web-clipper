name: Release

# 推 v1.7.0 这类 tag 时自动打包 zip 并挂到 Release 上
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 打包
        run: node scripts/package.js

      - name: 校验 tag 与 manifest 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./dist/ima-web-clipper/manifest.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag 是 $TAG，manifest 是 $VER"
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ima-web-clipper.zip
            dist/ima-web-clipper-*.zip
          body: |
            ## 安装（Chrome / Edge / QQ浏览器 / 360 通用）

            1. 下载并**解压** `ima-web-clipper.zip`（不要只解压一半，也不要留在压缩包的临时预览目录里）
            2. 把解压出的 `ima-web-clipper` 文件夹移到一个**固定位置**（移动后需重新加载一次）
            3. 扩展管理页 → 打开**开发者模式** → **加载已解压的扩展程序** → 选该文件夹

            > 不要用 .crx：Edge 会把它当未知来源，装上后立刻自动删除。
            > 360 浏览器需内核 ≥ 88（地址栏 `chrome://help` 查看），低于此版本装不了 Manifest V3。

            扩展 ID 已固定为 `piccfkjngomjhpbmlabnheidblehleai`，四个浏览器加载得到的是同一个 ID。
          make_latest: true
